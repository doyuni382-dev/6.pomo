<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Setting</title>
  <link rel="stylesheet" href="setting.css" />
</head>
<body>
  <div class="setting-card">
    <h3>setting</h3>

    <div class="form-group">
      <label for="timerMinutes">타이머 시간 (분)</label>
      <input type="number" id="timerMinutes" min="1" max="60" value="25" />
    </div>

    <button type="button" class="btn-complete" id="btnComplete" onclick="saveSetting()">설정 완료</button>
  </div>

  <script src="setting.js"></script>
</body>
</html>
