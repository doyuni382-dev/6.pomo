<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>춘천시 넥스템 컴퓨터 학원</title>
  <link rel="stylesheet" href="index.css" />
</head>

<body>
  <div class="timer-card">
    <h1>pomodoro</h1>

    <div class="current-time" id="currentTime"></div>

    <div class="time-display" id="timeDisplay">25:00</div>

    <div class="controls">
      <button type="button" class="btn btn-start" onclick="startTimer()">start</button>
      <button type="button" class="btn btn-stop" onclick="stopTimer()">stop</button>
      <button type="button" class="btn btn-reset" onclick="resetTimer()">clear</button>
    </div>

    <button type="button" class="btn-settings" onclick="location.href='setting.html'">설정</button>
  </div>

  <script src="index.js"></script>
</body>

</html>
